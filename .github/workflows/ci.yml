name: BuilderPass CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint and contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile smart contract
        run: npm run contracts:compile

      - name: Run smart contract tests
        run: npm run contracts:test

      - name: Lint frontend
        run: npm run lint --workspace=app

      - name: Build frontend
        run: npm run build
